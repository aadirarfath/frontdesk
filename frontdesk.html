<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontdesk | Arvo Support</title>
  <link rel="stylesheet" href="/web/style.css">
  <script defer src="/web/app.js"></script>
</head>
<body>
  <header class="mast"><strong>Frontdesk</strong><span>Arvo Support</span><button id="logout" hidden>Sign out</button></header>
  <main>
    <p id="feedback" role="status" hidden></p>
    <section id="entry" class="panel signin">
      <h1>Sign in to Frontdesk</h1>
      <form id="login">
        <label>Access key<input id="key" type="password" autocomplete="off" required></label>
        <button class="primary">Sign in</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="intro"><div><h1 id="heading">Tickets</h1><p id="identity"></p></div>
        <button id="refresh">Refresh</button></div>
      <form id="create" class="panel" hidden>
        <h2>Open a ticket</h2>
        <label>Subject<input name="subject" required maxlength="160"></label>
        <label>Priority<select name="priority"><option value="low">Low</option><option value="medium">Medium</option><option value="urgent">Urgent</option></select></label>
        <label>What happened?<textarea name="body" required maxlength="5000"></textarea></label>
        <button class="primary">Create ticket</button>
      </form>
      <div class="layout">
        <section class="panel queue">
          <div class="queue-head"><h2>Queue</h2><label id="filter-label" hidden>View
            <select id="filter"><option value="all">All tickets</option><option value="mine">Assigned to me</option><option value="unclaimed">Unclaimed</option><option value="late">Overdue</option><option value="waiting">Waiting</option></select>
          </label></div>
          <div id="tickets"></div>
        </section>
        <section class="panel detail" id="detail" aria-label="Ticket details">Select a ticket to see its conversation.</section>
      </div>
    </section>
  </main>
</body>
</html>
